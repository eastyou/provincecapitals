[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provincecapitals"
version = "0.1.0"
description = "中国省级行政区与省会：查询、分区浏览和配对练习"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "geography", "china", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
provincecapitals = "provincecapitals.cli:main"

[tool.setuptools]
packages = ["provincecapitals"]
